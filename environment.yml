# pinned the latest versions that resolved
# in a working env (mint_latest, October 2026). Use this to reproduce that env;
name: mint
channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.10
  - pip
  - biopython=1.88
  - einops=0.8.2
  - fairscale=0.4.13
  - hhsuite=3.3.0
  - hmmer=3.4
  - hydra-core=1.3.7
  - ipykernel=7.3.0
  - ipython=8.37.0
  - jupyter_client=8.10.0
  - jupyter_core=5.9.1
  - kalign2=2.04
  - omegaconf=2.3.1
  - openmm=8.6.0
  - pandas=2.3.3
  - pdbfixer=1.12
  - pytest=9.1.1
  - pip:
      - torch==2.14.1
      - absl-py==2.5.1
      - datasets==5.1.0
      - filelock==4.1.0
      - gdown==6.4.2
      - huggingface-hub==2.2.0
      - jupyterlab-widgets==3.0.17
      - lightning==2.6.6
      - matplotlib==3.10.9
      - numpy==2.2.6
      - openpyxl==3.1.5
      - protobuf==7.36.2
      - rdkit==2026.9.1
      - regex==2026.9.29
      - requests==2.34.2
      - scikit-learn==1.7.2
      - scipy==1.15.3
      - sentencepiece==0.2.2
